<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <title>Talaria</title>
</head>
<body>
<nav th:fragment="navbar" class="talaria-nav">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand" th:href="@{/}">TALARIA</a>

        <div class="d-flex align-items-center gap-3">

            <a th:href="@{/products}" class="nav-link">Products</a>
            <a th:href="@{/cart}" class="nav-link">🛒 Cart</a>

            <!-- Authenticated -->
            <a th:href="@{/orders}"
               class="nav-link"
               sec:authorize="isAuthenticated()">
                Orders
            </a>

            <a th:href="@{/admin}"
               sec:authorize="hasRole('ADMIN')"
               style="color: var(--accent) !important; font-size:0.85rem; letter-spacing:1px; text-transform:uppercase; text-decoration:none;">
                Admin
            </a>

            <a th:href="@{/auth/logout}"
               class="btn-outline-accent"
               sec:authorize="isAuthenticated()">
                Logout
            </a>

            <!-- Anonymous -->
            <a th:href="@{/auth/login}"
               class="nav-link"
               sec:authorize="isAnonymous()">
                Login
            </a>

            <a th:href="@{/auth/register}"
               class="btn-accent"
               sec:authorize="isAnonymous()">
                Register
            </a>

        </div>
    </div>
</nav>
</body>
</html>
