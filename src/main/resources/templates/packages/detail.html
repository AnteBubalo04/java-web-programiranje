<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pkg != null ? pkg.name : 'Package'})}">
    <title>LedVision</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">

    <div th:if="${pkg == null}" class="alert alert-danger">
        Package not found!
    </div>


    <div th:if="${pkg != null}">


        <p style="color:var(--text-muted); font-size:0.85rem; letter-spacing:1px; margin-bottom:2rem;">
            <a th:href="@{/}" style="color:var(--text-muted); text-decoration:none;">Home</a>
            <span class="mx-2">→</span>
            <a th:href="@{/packages}" style="color:var(--text-muted); text-decoration:none;">Packages</a>
            <span class="mx-2">→</span>
            <span style="color:var(--accent);" th:text="${pkg.name}"></span>
        </p>

        <div class="row g-5">


            <div class="col-md-5">
                <div style="background:var(--surface); border:1px solid var(--border); overflow:hidden;">
                    <img th:src="${pkg.imageUrl}"
                         th:if="${pkg.imageUrl != null}"
                         class="img-fluid"
                         style="width:100%; object-fit:cover; filter:grayscale(10%);"
                         alt="package"/>
                    <div th:if="${pkg.imageUrl == null}"
                         style="height:350px; display:flex; align-items:center; justify-content:center;">
                        <span style="color:var(--text-muted); font-size:3rem;">📺</span>
                    </div>
                </div>
            </div>


            <div class="col-md-7">
                <p style="color:var(--accent); font-size:0.75rem; letter-spacing:2px; text-transform:uppercase;"
                   th:text="${pkg.location.name}">
                </p>

                <h1 style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:2.5rem; color:var(--text); margin-top:0.5rem;"
                    th:text="${pkg.name}">
                    Package
                </h1>

                <p style="color:var(--text-muted); margin-top:1rem; line-height:1.8;"
                   th:text="${pkg.description}">
                </p>

                <!-- Pricing tiers: each row is one bookable duration/size combo,
                     the actual price now lives on the tier, not on the package -->
                <div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border);">
                    <h4 style="font-family:'Rajdhani',sans-serif; font-weight:700; margin-bottom:1rem;">
                        Pricing Options
                    </h4>

                    <div th:if="${#lists.isEmpty(tiers)}" style="color:var(--text-muted);">
                        No pricing options configured yet for this package.
                    </div>

                    <div th:each="tier : ${tiers}"
                         style="display:flex; align-items:center; justify-content:space-between;
                                padding:1rem; border:1px solid var(--border); margin-bottom:0.75rem;">
                        <div>
                            <p style="font-family:'Rajdhani',sans-serif; font-weight:700; margin:0;"
                               th:text="${tier.durationLabel} + ' · ' + ${tier.sizeLabel}"></p>
                            <p class="product-card-price" style="margin:0.25rem 0 0;"
                               th:text="${tier.price} + ' €'"></p>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <label>
                            <input type="number"
                                   th:id="'quantity-' + ${tier.id}"
                                   class="form-control"
                                   value="1"
                                   min="1"
                                   style="width:80px;"/>
                            </label>
                            <button class="btn-accent px-3 py-2"
                                    style="border:none; cursor:pointer;"
                                    th:onclick="'addToCart(' + ${tier.id} + ', &quot;quantity-' + ${tier.id} + '&quot;)'">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>

                <div id="cartMessage" class="mt-3"></div>

                <a th:href="@{/packages}"
                   style="display:inline-block; margin-top:1.5rem; color:var(--text-muted); text-decoration:none; font-size:0.85rem; letter-spacing:1px;">
                    ← Back to Packages
                </a>
            </div>
        </div>

        <!-- Example ads: photos/videos of what a campaign on this screen looks
             like. mediaType picks whether each item renders as <img> or <video>. -->
        <div th:if="${examples != null and !#lists.isEmpty(examples)}"
             style="margin-top:3rem; padding-top:2rem; border-top:1px solid var(--border);">
            <h4 style="font-family:'Rajdhani',sans-serif; font-weight:700; margin-bottom:1.5rem;">
                Example Ads
            </h4>
            <div class="row g-4">
                <div th:each="example : ${examples}" class="col-md-4 col-sm-6">
                    <div style="background:var(--surface); border:1px solid var(--border); overflow:hidden;">
                        <img th:if="${example.mediaType.name() == 'IMAGE'}"
                             th:src="${example.mediaUrl}"
                             class="img-fluid"
                             style="width:100%; object-fit:cover;"
                             alt="ad example"/>
                        <video th:if="${example.mediaType.name() == 'VIDEO'}"
                               th:src="${example.mediaUrl}"
                               style="width:100%;"
                               controls>
                        </video>
                    </div>
                    <p th:if="${example.caption != null}"
                       style="color:var(--text-muted); font-size:0.85rem; margin-top:0.5rem;"
                       th:text="${example.caption}"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script th:src="@{/js/cart.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
