<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Packages')}">
    <title></title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">


    <div class="row mb-5 align-items-center">
        <div class="col-md-6 mb-3 mb-md-0">
            <form th:action="@{/packages}" method="get">
                <div class="input-group">
                    <label>
                    <input type="text"
                           name="search"
                           class="form-control"
                           placeholder="Search packages..."
                           th:value="${search}"/>
                        Search Packages
                    </label>
                    <button class="btn-accent px-4"
                            style="border:none; cursor:pointer;"
                            type="submit">
                        Search
                    </button>
                </div>
            </form>
        </div>
        <div class="col-md-6">
            <div class="d-flex gap-2 flex-wrap justify-content-md-end">
                <a th:href="@{/packages}"
                   class="category-pill"
                   th:classappend="${selectedLocation == null} ? ' active' : ''">
                    All
                </a>
                <a th:each="location : ${locations}"
                   th:href="@{/packages(locationId=${location.id})}"
                   th:text="${location.name}"
                   th:classappend="${selectedLocation == location.id} ? ' active' : ''"
                   class="category-pill">
                </a>
            </div>
        </div>
    </div>


    <h2 class="section-title mb-4">
        <span th:if="${search != null and !#strings.isEmpty(search)}"
              th:text="'Results for: ' + ${search}">
        </span>
        <span th:if="${search == null or #strings.isEmpty(search)}">
            All <span>Packages</span>
        </span>
    </h2>


    <div class="row g-4">
        <div th:if="${#lists.isEmpty(packages)}" class="col-12">
            <p style="color: var(--text-muted);">No packages found.</p>
        </div>
        <div th:each="pkg : ${packages}" class="col-md-4 col-sm-6">
            <div class="product-card h-100">
                <div class="product-card-img-wrap">
                    <img th:src="${pkg.imageUrl}"
                         th:if="${pkg.imageUrl != null}"
                         class="product-card-img"
                         alt=""/>
                    <div th:if="${pkg.imageUrl == null}"
                         class="product-card-img-placeholder">⚡</div>
                </div>
                <div class="product-card-body">
                    <p class="product-card-category"
                       th:text="${pkg.location.name}"></p>
                    <h5 class="product-card-title"
                        th:text="${pkg.name}">
                        Package
                    </h5>
                    <p class="product-card-desc"
                       th:text="${pkg.description}"></p>
                </div>
                <div class="product-card-footer">
                    <a th:href="@{/packages/{id}(id=${pkg.id})}"
                       class="btn-accent d-block text-center py-2"
                       style="text-decoration:none;">
                        View Details →
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
