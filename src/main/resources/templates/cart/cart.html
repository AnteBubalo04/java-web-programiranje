<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head th:replace="~{fragments/head :: head('Cart')}">
    <title></title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">

    <h2 class="section-title mb-4">Your <span>Cart</span></h2>

    <!-- Empty cart -->
    <div th:if="${cartCount == 0}"
         style="text-align:center; padding:4rem 0;">
        <p style="font-size:3rem;">🛒</p>
        <p style="color:var(--text-muted); font-size:1.1rem;">Your cart is empty</p>
        <a th:href="@{/products}" class="btn-accent mt-3"
           style="display:inline-block; padding:0.6rem 1.5rem; text-decoration:none;">
            Browse Products
        </a>
    </div>

    <!-- Cart with items -->
    <div th:if="${cartCount > 0}">
        <div style="border:1px solid var(--border);">

            <!-- Header -->
            <div class="row py-3 px-4"
                 style="border-bottom:1px solid var(--border);
                        color:var(--text-muted);
                        font-size:0.75rem;
                        letter-spacing:1px;
                        text-transform:uppercase;">
                <div class="col-md-6">Product</div>
                <div class="col-md-2 text-center">Price</div>
                <div class="col-md-2 text-center">Quantity</div>
                <div class="col-md-2 text-center">Total</div>
            </div>

            <!-- Items -->
            <div th:each="entry : ${cartItems}">
                <div class="row py-4 px-4 align-items-center"
                     style="border-bottom:1px solid var(--border);">

                    <div class="col-md-6 d-flex align-items-center gap-3">
                        <img th:src="${entry.key.imageUrl}"
                             th:if="${entry.key.imageUrl != null}"
                             style="width:70px; height:70px; object-fit:cover; filter:grayscale(20%);"
                             alt=""/>
                        <div>
                            <p style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.1rem; margin:0;"
                               th:text="${entry.key.name}"></p>
                            <p style="color:var(--text-muted); font-size:0.8rem; margin:0;"
                               th:text="${entry.key.category.name}"></p>
                        </div>
                    </div>

                    <div class="col-md-2 text-center"
                         style="color:var(--text-muted);"
                         th:text="${#numbers.formatDecimal(entry.key.price, 1, 2)} + ' €'">
                    </div>

                    <div class="col-md-2 text-center">
                        <div class="d-flex align-items-center justify-content-center gap-2">
                            <button class="btn-qty"
                                    th:onclick="'updateQuantity(' + ${entry.key.id} + ', ' + ${entry.value - 1} + ')'">−</button>
                            <span th:text="${entry.value}" style="min-width:2rem; text-align:center;"></span>
                            <button class="btn-qty"
                                    th:onclick="'updateQuantity(' + ${entry.key.id} + ', ' + ${entry.value + 1} + ')'">+</button>
                        </div>
                    </div>

                    <div class="col-md-2 text-center d-flex align-items-center justify-content-center gap-3">
                        <span style="color:var(--accent); font-family:'Rajdhani',sans-serif; font-weight:700;"
                              th:text="${#numbers.formatDecimal(itemTotals[entry.key.id], 1, 2)} + ' €'"></span>
                        <button style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.1rem;"
                                th:onclick="'removeFromCart(' + ${entry.key.id} + ')'">×</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cart footer -->
        <div class="row mt-4">
            <div class="col-md-6">
                <button onclick="clearCart()"
                        style="background:none; border:1px solid var(--border); color:var(--text-muted);
                               padding:0.5rem 1rem; cursor:pointer; font-size:0.85rem; letter-spacing:1px;">
                    Clear Cart
                </button>
            </div>
            <div class="col-md-6 text-end">
                <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:0.5rem;">Order total:</p>
                <p style="font-family:'Rajdhani',sans-serif; font-size:2rem; font-weight:700; color:var(--accent);"
                   th:text="${#numbers.formatDecimal(cartTotal, 1, 2)} + ' €'"></p>

                <div class="d-flex gap-2 justify-content-end mt-3">
                    <a th:href="@{/products}" class="btn-outline-accent"
                       style="padding:0.6rem 1.2rem; text-decoration:none;">
                        ← Continue Shopping
                    </a>
                    <a th:href="@{/checkout}"
                       sec:authorize="isAuthenticated()"
                       class="btn-accent"
                       style="padding:0.6rem 1.5rem; text-decoration:none;">
                        Checkout →
                    </a>
                    <a th:href="@{/auth/login}"
                       sec:authorize="isAnonymous()"
                       class="btn-accent"
                       style="padding:0.6rem 1.5rem; text-decoration:none;">
                        Login to Check out →
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script th:src="@{/js/cart.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
