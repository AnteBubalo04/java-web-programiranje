<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('My Orders')}">
    <title>Talaria</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <h2 class="section-title mb-4">My <span>Orders</span></h2>

    <div th:if="${#lists.isEmpty(orders)}"
         style="text-align:center; padding:4rem 0;">
        <p style="font-size:2rem;">📦</p>
        <p style="color:var(--text-muted); font-size:1.1rem;">No orders yet.</p>
        <a th:href="@{/products}" class="btn-accent mt-3"
           style="display:inline-block; padding:0.6rem 1.5rem; text-decoration:none;">
            Start Shopping
        </a>
    </div>


    <div th:if="${!#lists.isEmpty(orders)}"
         style="border:1px solid var(--border);">


        <div class="row py-2 px-4"
             style="border-bottom:1px solid var(--border);
                    color:var(--text-muted);
                    font-size:0.75rem;
                    letter-spacing:1px;
                    text-transform:uppercase;">
            <div class="col-md-2">Order #</div>
            <div class="col-md-3">Date</div>
            <div class="col-md-2">Payment</div>
            <div class="col-md-2">Status</div>
            <div class="col-md-2">Total</div>
            <div class="col-md-1"></div>
        </div>

        <div th:each="order : ${orders}"
             class="row py-3 px-4 align-items-center"
             style="border-bottom:1px solid var(--border);">

            <div class="col-md-2"
                 style="font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--accent);"
                 th:text="'#' + ${order.id}">
            </div>

            <div class="col-md-3"
                 style="color:var(--text-muted); font-size:0.9rem;"
                 th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">
            </div>

            <div class="col-md-2"
                 style="color:var(--text-muted); font-size:0.9rem;"
                 th:text="${order.paymentMethod}">
            </div>

            <div class="col-md-2">
              <span th:text="${order.status}"
                    th:class="${order.status.name() == 'DELIVERED'} ? 'status-delivered' :
                (${order.status.name() == 'CANCELLED'} ? 'status-cancelled' : 'status-pending')">
</span>
            </div>

            <div class="col-md-2"
                 style="font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--accent);"
                 th:text="${#numbers.formatDecimal(order.totalPrice, 1, 2)} + ' €'">
            </div>

            <div class="col-md-1">
                <a th:href="@{/orders/{id}(id=${order.id})}"
                   style="color:var(--text-muted); text-decoration:none; font-size:0.85rem;">
                    View →
                </a>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
