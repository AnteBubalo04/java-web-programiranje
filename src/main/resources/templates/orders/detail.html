<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Order Details')}">
    <title>LedVision</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">

    <div th:if="${order == null}" class="alert alert-danger">
        Order not found!
    </div>

    <div th:if="${order != null}">

        <!-- Breadcrumb -->
        <p style="color:var(--text-muted); font-size:0.85rem; letter-spacing:1px; margin-bottom:2rem;">
            <a th:href="@{/orders}" style="color:var(--text-muted); text-decoration:none;">My Orders</a>
            <span class="mx-2">→</span>
            <span style="color:var(--accent);" th:text="'Order #' + ${order.id}"></span>
        </p>

        <div class="row g-5">

            <!-- Order Items -->
            <div class="col-md-7">
                <h4 style="font-family:'Rajdhani',sans-serif; font-size:1.3rem; margin-bottom:1rem;">
                    Items
                </h4>
                <div style="border:1px solid var(--border);">
                    <div th:each="item : ${order.items}"
                         class="row py-3 px-4 align-items-center"
                         style="border-bottom:1px solid var(--border);">
                        <div class="col-6 d-flex align-items-center gap-3">
                            <img th:src="${item.pricingTier.adSpacePackage.imageUrl}"
                                 th:if="${item.pricingTier.adSpacePackage.imageUrl != null}"
                                 style="width:50px; height:50px; object-fit:cover; filter:grayscale(20%);"
                                 alt=""/>
                            <div>
                                <p style="font-family:'Rajdhani',sans-serif; font-weight:700; margin:0;"
                                   th:text="${item.pricingTier.adSpacePackage.name} + ' — ' + ${item.pricingTier.durationLabel} + ' / ' + ${item.pricingTier.sizeLabel}"></p>
                                <p style="color:var(--text-muted); font-size:0.8rem; margin:0;"
                                   th:text="${item.pricingTier.adSpacePackage.location.name}"></p>
                            </div>
                        </div>
                        <div class="col-2 text-center"
                             style="color:var(--text-muted);"
                             th:text="'x' + ${item.quantity}">
                        </div>
                        <div class="col-2 text-center"
                             style="color:var(--text-muted);"
                             th:text="${item.priceAtPurchase} + ' €'">
                        </div>
                        <div class="col-2 text-center"
                             style="color:var(--accent); font-family:'Rajdhani',sans-serif; font-weight:700;"
                             th:text="${#numbers.formatDecimal(itemTotals[item.id], 1, 2)} + ' €'">
                        </div>
                    </div>
                </div>


                <h4 style="font-family:'Rajdhani',sans-serif; font-size:1.3rem; margin:2rem 0 1rem;">
                    Shipping Address
                </h4>
                <div style="background:var(--surface); border:1px solid var(--border); padding:1.5rem;">
                    <p style="font-family:'Rajdhani',sans-serif; font-weight:700; margin:0 0 0.5rem;"
                       th:text="${order.shippingFullName}"></p>
                    <p style="color:var(--text-muted); margin:0;"
                       th:text="${order.shippingAddress}"></p>
                    <p style="color:var(--text-muted); margin:0;"
                       th:text="${order.shippingPostalCode} + ' ' + ${order.shippingCity}"></p>
                    <p style="color:var(--text-muted); margin:0;"
                       th:text="${order.shippingCountry}"></p>
                </div>
            </div>


            <div class="col-md-5">
                <h4 style="font-family:'Rajdhani',sans-serif; font-size:1.3rem; margin-bottom:1rem;">
                    Order Info
                </h4>
                <div style="background:var(--surface); border:1px solid var(--border); padding:1.5rem;">

                    <div class="d-flex justify-content-between mb-3">
                        <span style="color:var(--text-muted);">Order #</span>
                        <span style="font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--accent);"
                              th:text="${order.id}"></span>
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <span style="color:var(--text-muted);">Date</span>
                        <span th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <span style="color:var(--text-muted);">Payment</span>
                        <span th:text="${order.paymentMethod}"></span>
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <span style="color:var(--text-muted);">Status</span>
                        <span th:text="${order.status}"
                              th:class="${order.status.name() == 'DELIVERED'} ? 'status-delivered' :
                (${order.status.name() == 'CANCELLED'} ? 'status-cancelled' : 'status-pending')">
</span>
                    </div>

                    <div th:if="${order.trackingNumber != null}"
                         class="d-flex justify-content-between mb-3">
                        <span style="color:var(--text-muted);">Tracking</span>
                        <span style="color:var(--accent);" th:text="${order.trackingNumber}"></span>
                    </div>

                    <div style="border-top:1px solid var(--border); padding-top:1rem; margin-top:1rem;">
                        <div class="d-flex justify-content-between">
                            <span style="color:var(--text-muted);">Total</span>
                            <span style="font-family:'Rajdhani',sans-serif; font-size:1.5rem; font-weight:700; color:var(--accent);"
                                  th:text="${#numbers.formatDecimal(order.totalPrice, 1, 2)} + ' €'">
                            </span>
                        </div>
                    </div>
                </div>

                <a th:href="@{/orders}"
                   style="display:block; text-align:center; margin-top:1rem; color:var(--text-muted);
                          text-decoration:none; font-size:0.85rem; letter-spacing:1px;">
                    ← Back to Orders
                </a>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
