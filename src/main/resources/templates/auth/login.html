<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Login')}">
    <title></title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="auth-card">
                <h2 class="auth-title">LOGIN</h2>

                <div th:if="${param.error}" class="alert alert-danger">
                    Incorrect username or password!
                </div>

                <div th:if="${param.registered}" class="alert alert-success">
                    Registration successful! You can now log in.
                </div>

                <form th:action="@{/auth/login}" method="post">
                    <div class="mb-4">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                               placeholder="Enter your username" required/>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="Enter your password" required/>
                    </div>
                    <button type="submit" class="btn-accent w-100 py-2"
                            style="display:block; text-align:center; cursor:pointer; border:none;">
                        Login
                    </button>
                </form>

                <hr class="divider"/>

                <p class="text-center mb-0" style="color:var(--text-muted); font-size:0.9rem;">
                    Don't have an account?
                    <a th:href="@{/auth/register}" style="color:var(--accent); text-decoration:none;">
                        Register
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
