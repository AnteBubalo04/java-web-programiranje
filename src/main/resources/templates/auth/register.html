<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Register')}">
    <title></title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="auth-card">
                <h2 class="auth-title">REGISTER</h2>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <<form id="registerForm">
                <div class="mb-4">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Enter your username" required/>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="name@email.com" required/>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter your password" required/>
                </div>

                <div id="errorMessage"></div>

                <button type="button" onclick="register()"
                        class="btn-accent w-100 py-2 mt-2"
                        style="display:block; text-align:center; cursor:pointer;">
                    Create Account
                </button>
            </form>

                <hr class="divider"/>

                <p class="text-center mb-0" style="color:var(--text-muted); font-size:0.9rem;">
                    Already have an account?
                    <a th:href="@{/auth/login}" style="color:var(--accent); text-decoration:none;">
                        Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/auth.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
