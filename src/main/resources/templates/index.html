<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head th:replace="~{fragments/head :: head('Home')}">
    <title></title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>


<section class="hero">
    <div class="container">
        <div class="row align-items-center g-5">
            <div class="col-md-6">
                <p class="hero-eyebrow">Electric Mobility</p>
                <h1 class="hero-title">
                    RIDE THE<br>
                    <span>FUTURE</span>
                </h1>
                <p class="hero-subtitle mt-3">
                    Premium electric motorcycles and original parts for demanding riders.
                </p>
                <div class="mt-4 d-flex gap-3 flex-wrap">
                    <a th:href="@{/products}" class="btn-accent">Explore Products</a>
                    <a th:href="@{/auth/register}"
                       class="btn-outline-accent"
                       sec:authorize="isAnonymous()">
                        Create Account
                    </a>
                </div>
            </div>
            <div class="col-md-6 d-none d-md-flex justify-content-end">
                <div class="hero-img-wrap">
                    <img src="https://pub-cd912391122948fdae11b9f83650f0e4.r2.dev/Talaria/Gemini_Generated_Image_snkn1rsnkn1rsnkn.png"
                         alt="Talaria"/>
                </div>
            </div>
        </div>
    </div>
</section>


<section class="container section-gap"
         th:if="${categories != null and !#lists.isEmpty(categories)}">
    <h2 class="section-title">Shop by <span>Category</span></h2>
    <div class="row g-4 mt-1">
        <div th:each="category : ${categories}" class="col-md-4 col-sm-6">
            <a th:href="@{/products(categoryId=${category.id})}"
               class="category-card-link">
                <div class="category-card">
                    <div class="category-card-img">
                        <img th:src="${category.imageUrl}"
                             th:if="${category.imageUrl != null}"
                             alt=""/>
                        <div th:if="${category.imageUrl == null}"
                             class="category-card-placeholder">⚡</div>
                    </div>
                    <div class="category-card-body">
                        <h4 th:text="${category.name}">
                            Category
                        </h4>
                        <p th:text="${category.description}"></p>
                        <span class="category-card-cta">Shop Now →</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</section>


<section class="container section-gap"
         th:if="${products != null and !#lists.isEmpty(products)}">
    <h2 class="section-title">Featured <span>Products</span></h2>
    <div class="row g-4">
        <div th:each="product : ${products}" class="col-md-4 col-sm-6">
            <div class="product-card h-100">
                <div class="product-card-img-wrap">
                    <img th:src="${product.imageUrl}"
                         th:if="${product.imageUrl != null}"
                         class="product-card-img" alt=""/>
                    <div th:if="${product.imageUrl == null}"
                         class="product-card-img-placeholder">⚡</div>
                </div>
                <div class="product-card-body">
                    <p class="product-card-category"
                       th:text="${product.category.name}"></p>
                    <h5 class="product-card-title"
                        th:text="${product.name}">
                        Product
                    </h5>
                    <p class="product-card-desc"
                       th:text="${product.description}"></p>
                    <p class="product-card-price"
                       th:text="${product.price} + ' €'"></p>
                </div>
                <div class="product-card-footer">
                    <a th:href="@{/products/{id}(id=${product.id})}"
                       class="btn-accent d-block text-center"
                       style="text-decoration:none;">
                        View Product →
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
