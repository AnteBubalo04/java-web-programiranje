<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head th:replace="~{fragments/head :: head('Home')}">
    <title></title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>


<section class="hero">
    <div class="container">
        <div class="row align-items-center g-5">
            <div class="col-md-6">
                <p class="hero-eyebrow">Electric Mobility</p>
                <h1 class="hero-title">
                    RIDE THE<br>
                    <span>FUTURE</span>
                </h1>
                <p class="hero-subtitle mt-3">
                    Premium electric motorcycles and original parts for demanding riders.
                </p>
                <div class="mt-4 d-flex gap-3 flex-wrap">
                    <a th:href="@{/packages}" class="btn-accent">Explore Products</a>
                    <a th:href="@{/auth/register}"
                       class="btn-outline-accent"
                       sec:authorize="isAnonymous()">
                        Create Account
                    </a>
                </div>
            </div>
            <div class="col-md-6 d-none d-md-flex justify-content-end">
                <div class="hero-img-wrap">
                    <img src="https://pub-cd912391122948fdae11b9f83650f0e4.r2.dev/Talaria/Gemini_Generated_Image_snkn1rsnkn1rsnkn.png"
                         alt="Talaria"/>
                </div>
            </div>
        </div>
    </div>
</section>


<section class="container section-gap"
         th:if="${locations != null and !#lists.isEmpty(locations)}">
    <h2 class="section-title">Browse by <span>Location</span></h2>
    <div class="row g-4 mt-1">
        <div th:each="location : ${locations}" class="col-md-4 col-sm-6">
            <a th:href="@{/packages(locationId=${location.id})}"
               class="category-card-link">
                <div class="category-card">
                    <div class="category-card-img">
                        <img th:src="${location.imageUrl}"
                             th:if="${location.imageUrl != null}"
                             alt=""/>
                        <div th:if="${location.imageUrl == null}"
                             class="category-card-placeholder">⚡</div>
                    </div>
                    <div class="category-card-body">
                        <h4 th:text="${location.name}">
                            Location
                        </h4>
                        <p th:text="${location.description}"></p>
                        <span class="category-card-cta">View Packages →</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</section>


<section class="container section-gap"
         th:if="${packages != null and !#lists.isEmpty(packages)}">
    <h2 class="section-title">Featured <span>Packages</span></h2>
    <div class="row g-4">
        <div th:each="pkg : ${packages}" class="col-md-4 col-sm-6">
            <div class="product-card h-100">
                <div class="product-card-img-wrap">
                    <img th:src="${pkg.imageUrl}"
                         th:if="${pkg.imageUrl != null}"
                         class="product-card-img" alt=""/>
                    <div th:if="${pkg.imageUrl == null}"
                         class="product-card-img-placeholder">⚡</div>
                </div>
                <div class="product-card-body">
                    <p class="product-card-category"
                       th:text="${pkg.location.name}"></p>
                    <h5 class="product-card-title"
                        th:text="${pkg.name}">
                        Package
                    </h5>
                    <p class="product-card-desc"
                       th:text="${pkg.description}"></p>
                </div>
                <div class="product-card-footer">
                    <a th:href="@{/packages/{id}(id=${pkg.id})}"
                       class="btn-accent d-block text-center"
                       style="text-decoration:none;">
                        View Package →
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
