<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Admin - Orders')}">
    <title>Talaria</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="section-title mb-0">All <span>Orders</span></h2>
        <a th:href="@{/admin}" class="btn-outline-accent"
           style="padding:0.4rem 1rem; text-decoration:none; font-size:0.9rem;">
            ← Back to Dashboard
        </a>
    </div>

    <div style="border:1px solid var(--border);">

        <!-- Header -->
        <div class="row py-2 px-4"
             style="border-bottom:1px solid var(--border);
                    color:var(--text-muted);
                    font-size:0.75rem;
                    letter-spacing:1px;
                    text-transform:uppercase;">
            <div class="col-md-1">Order #</div>
            <div class="col-md-2">User</div>
            <div class="col-md-2">Date</div>
            <div class="col-md-2">Payment</div>
            <div class="col-md-2">Status</div>
            <div class="col-md-2">Total</div>
            <div class="col-md-1"></div>
        </div>

        <div th:if="${#lists.isEmpty(orders)}"
             class="py-4 px-4"
             style="color:var(--text-muted);">
            No orders found.
        </div>

        <div th:each="order : ${orders}"
             class="row py-3 px-4 align-items-center"
             style="border-bottom:1px solid var(--border);">

            <div class="col-md-1"
                 style="font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--accent);"
                 th:text="'#' + ${order.id}">
            </div>

            <div class="col-md-2"
                 style="font-size:0.9rem;"
                 th:text="${order.user.username}">
            </div>

            <div class="col-md-2"
                 style="color:var(--text-muted); font-size:0.85rem;"
                 th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">
            </div>

            <div class="col-md-2"
                 style="color:var(--text-muted); font-size:0.85rem;"
                 th:text="${order.paymentMethod}">
            </div>

            <div class="col-md-2">
                <span th:text="${order.status}"
                      th:class="${order.status.name() == 'DELIVERED'} ? 'status-delivered' :
                                (${order.status.name() == 'CANCELLED'} ? 'status-cancelled' : 'status-pending')">
                </span>
            </div>

            <div class="col-md-2"
                 style="font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--accent);"
                 th:text="${#numbers.formatDecimal(order.totalPrice, 1, 2)} + ' €'">
            </div>

            <div class="col-md-1">
                <!-- Status update form -->
                <form th:action="@{/admin/orders/{id}/status(id=${order.id})}"
                      method="post">
                    <select name="status"
                            class="form-control"
                            aria-label="Order status"
                            style="font-size:0.75rem; padding:0.2rem;"
                            onchange="this.form.submit()">
                        <option th:each="status : ${T(hr.algebra.ledvision.model.Order.OrderStatus).values()}"
                                th:value="${status}"
                                th:text="${status}"
                                th:selected="${order.status == status}">
                        </option>
                    </select>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
