<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Admin Dashboard')}">
    <title>Talaria</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="section-title mb-0">Admin <span>Dashboard</span></h2>
    </div>

    <!-- Tabs -->
    <ul class="nav mb-4" style="border-bottom:1px solid var(--border);">
        <li class="nav-item">
            <a href="#packages"
               style="color:var(--accent); border-bottom:2px solid var(--accent);
                  padding:0.5rem 1rem; text-decoration:none; font-size:0.85rem;
                  letter-spacing:1px; text-transform:uppercase; display:inline-block;">
                Packages
            </a>
        </li>
        <li class="nav-item">
            <a href="#locations"
               style="color:var(--text-muted); padding:0.5rem 1rem; text-decoration:none;
                  font-size:0.85rem; letter-spacing:1px; text-transform:uppercase; display:inline-block;">
                Locations
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/login-history}"
               style="color:var(--text-muted); padding:0.5rem 1rem; text-decoration:none;
                  font-size:0.85rem; letter-spacing:1px; text-transform:uppercase; display:inline-block;">
                Login History
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/orders}"
               style="color:var(--text-muted); padding:0.5rem 1rem; text-decoration:none;
                  font-size:0.85rem; letter-spacing:1px; text-transform:uppercase; display:inline-block;">
                Orders
            </a>
        </li>
    </ul>

    <!-- Packages -->
    <div id="packages" class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 style="font-family:'Rajdhani',sans-serif; font-size:1.3rem;">Packages</h3>
            <a th:href="@{/admin/packages/new}" class="btn-accent"
               style="padding:0.4rem 1rem; text-decoration:none; font-size:0.9rem;">
                + New Package
            </a>
        </div>

        <div style="border:1px solid var(--border);">
            <div class="row py-2 px-4"
                 style="border-bottom:1px solid var(--border);
                        color:var(--text-muted);
                        font-size:0.75rem;
                        letter-spacing:1px;
                        text-transform:uppercase;">
                <div class="col-md-4">Name</div>
                <div class="col-md-3">Location</div>
                <div class="col-md-2">Price</div>
                <div class="col-md-2">In Stock</div>
                <div class="col-md-1"></div>
            </div>

            <div th:if="${#lists.isEmpty(packages)}"
                 class="py-4 px-4"
                 style="color:var(--text-muted);">
                No packages found.
            </div>

            <div th:each="pkg : ${packages}"
                 class="row py-3 px-4 align-items-center"
                 style="border-bottom:1px solid var(--border);">
                <div class="col-md-4"
                     style="font-family:'Rajdhani',sans-serif; font-weight:700;"
                     th:text="${pkg.name}">
                </div>
                <div class="col-md-3"
                     style="color:var(--text-muted); font-size:0.9rem;"
                     th:text="${pkg.location.name}">
                </div>
                <div class="col-md-2"
                     style="color:var(--accent); font-family:'Rajdhani',sans-serif;"
                     th:text="${pkg.price} + ' €'">
                </div>
                <div class="col-md-2"
                     style="color:var(--text-muted);"
                     th:text="${pkg.stockQuantity} + ' pcs'">
                </div>
                <div class="col-md-1 d-flex gap-2">
                    <a th:href="@{/admin/packages/edit/{id}(id=${pkg.id})}"
                       style="color:var(--text-muted); text-decoration:none; font-size:0.85rem;">✎</a>
                    <form th:action="@{/admin/packages/delete/{id}(id=${pkg.id})}"
                          method="post"
                          onsubmit="return confirm('Delete this package?')">
                        <button type="submit"
                                style="background:none; border:none; color:#ff6666; cursor:pointer; font-size:0.85rem;">×</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Locations -->
    <div id="locations" class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 style="font-family:'Rajdhani',sans-serif; font-size:1.3rem;">Locations</h3>
            <a th:href="@{/admin/locations/new}" class="btn-accent"
               style="padding:0.4rem 1rem; text-decoration:none; font-size:0.9rem;">
                + New Location
            </a>
        </div>

        <div style="border:1px solid var(--border);">
            <div class="row py-2 px-4"
                 style="border-bottom:1px solid var(--border);
                        color:var(--text-muted);
                        font-size:0.75rem;
                        letter-spacing:1px;
                        text-transform:uppercase;">
                <div class="col-md-4">Name</div>
                <div class="col-md-6">Description</div>
                <div class="col-md-2"></div>
            </div>

            <div th:if="${#lists.isEmpty(locations)}"
                 class="py-4 px-4"
                 style="color:var(--text-muted);">
                No locations found.
            </div>

            <div th:each="location : ${locations}"
                 class="row py-3 px-4 align-items-center"
                 style="border-bottom:1px solid var(--border);">
                <div class="col-md-4"
                     style="font-family:'Rajdhani',sans-serif; font-weight:700;"
                     th:text="${location.name}">
                </div>
                <div class="col-md-6"
                     style="color:var(--text-muted); font-size:0.9rem;"
                     th:text="${location.description}">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <a th:href="@{/admin/locations/edit/{id}(id=${location.id})}"
                       style="color:var(--text-muted); text-decoration:none; font-size:0.85rem;">✎</a>
                    <form th:action="@{/admin/locations/delete/{id}(id=${location.id})}"
                          method="post"
                          onsubmit="return confirm('Delete this location?')">
                        <button type="submit"
                                style="background:none; border:none; color:#ff6666; cursor:pointer; font-size:0.85rem;">×</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
