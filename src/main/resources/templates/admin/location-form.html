<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Admin - Location')}">
    <title>Talaria</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="auth-card">
                <h2 class="auth-title"
                    th:text="${location.id != null} ? 'EDIT LOCATION' : 'NEW LOCATION'">
                    Location
                </h2>

                <form th:action="@{/admin/locations/save}" method="post">
                    <input type="hidden" name="id" th:value="${location.id}"/>

                    <div class="mb-4">
                        <label class="form-label">Name
                        <input type="text"
                               name="name"
                               class="form-control"
                               th:value="${location.name}"
                               required/>
                            </label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description
                        <textarea name="description"
                                  class="form-control"
                                  rows="3"
                                  th:text="${location.description}">
                        </textarea>
                            </label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Image URL
                        <input type="text"
                               name="imageUrl"
                               class="form-control"
                               placeholder="https://..."
                               th:value="${location.imageUrl}"/>
                    </label>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit"
                                class="btn-accent px-4 py-2"
                                style="border:none; cursor:pointer;">
                            Save
                        </button>
                        <a th:href="@{/admin}"
                           class="btn-outline-accent px-4 py-2"
                           style="text-decoration:none;">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
