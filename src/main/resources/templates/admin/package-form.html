<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Admin - Package')}">
   <title>Talaria</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="auth-card">
                <h2 class="auth-title"
                    th:text="${pkg.id != null} ? 'EDIT PACKAGE' : 'NEW PACKAGE'">
                    Package
                </h2>

                <form th:action="@{/admin/packages/save}" method="post">
                    <input type="hidden" name="id" th:value="${pkg.id}"/>

                    <div class="mb-4">
                        <label class="form-label">Name
                        <input type="text"
                               name="name"
                               class="form-control"
                               th:value="${pkg.name}"
                               required/>
                        </label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description
                        <textarea name="description"
                                  class="form-control"
                                  rows="3"
                                  th:text="${pkg.description}">
                        </textarea>
                        </label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Image URL
                        <input type="text"
                               name="imageUrl"
                               class="form-control"
                               placeholder="https://..."
                               th:value="${pkg.imageUrl}"/>
                        </label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Location
                        <select name="locationId" class="form-control">
                            <option th:each="location : ${locations}"
                                    th:value="${location.id}"
                                    th:text="${location.name}"
                                    th:selected="${pkg.location != null and pkg.location.id == location.id}">
                            </option>
                        </select>
                        </label>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit"
                                class="btn-accent px-4 py-2"
                                style="border:none; cursor:pointer;">
                            Save
                        </button>
                        <a th:href="@{/admin}"
                           class="btn-outline-accent px-4 py-2"
                           style="text-decoration:none;">
                            Cancel
                        </a>
                    </div>
                </form>

                <!-- Pricing tiers only make sense once the package already has an id
                     (a tier must belong to a saved package) - save the package first,
                     then come back here to add tiers. -->
                <div th:if="${pkg.id != null}" style="border-top:1px solid var(--border); margin-top:2rem; padding-top:1.5rem;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 style="font-family:'Rajdhani',sans-serif; font-weight:700; margin:0;">Pricing Tiers</h4>
                        <a th:href="@{/admin/packages/{id}/tiers/new(id=${pkg.id})}"
                           class="btn-accent" style="padding:0.3rem 0.8rem; text-decoration:none; font-size:0.85rem;">
                            + New Tier
                        </a>
                    </div>

                    <div th:if="${#lists.isEmpty(tiers)}" style="color:var(--text-muted);">
                        No pricing tiers yet.
                    </div>

                    <div th:each="tier : ${tiers}"
                         class="d-flex justify-content-between align-items-center py-2"
                         style="border-bottom:1px solid var(--border);">
                        <span th:text="${tier.durationLabel} + ' · ' + ${tier.sizeLabel} + ' · ' + ${tier.price} + ' €'"></span>
                        <div class="d-flex gap-2">
                            <a th:href="@{/admin/tiers/edit/{id}(id=${tier.id})}"
                               style="color:var(--text-muted); text-decoration:none; font-size:0.85rem;">✎</a>
                            <form th:action="@{/admin/tiers/delete/{id}(id=${tier.id})}" method="post"
                                  onsubmit="return confirm('Delete this pricing tier?')">
                                <input type="hidden" name="packageId" th:value="${pkg.id}"/>
                                <button type="submit"
                                        style="background:none; border:none; color:#ff6666; cursor:pointer; font-size:0.85rem;">×</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Example ad media (photos/videos of what an ad on this package
                     looks like) - same "only once the package has an id" rule as tiers. -->
                <div th:if="${pkg.id != null}" style="border-top:1px solid var(--border); margin-top:2rem; padding-top:1.5rem;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 style="font-family:'Rajdhani',sans-serif; font-weight:700; margin:0;">Ad Examples</h4>
                        <a th:href="@{/admin/packages/{id}/examples/new(id=${pkg.id})}"
                           class="btn-accent" style="padding:0.3rem 0.8rem; text-decoration:none; font-size:0.85rem;">
                            + New Example
                        </a>
                    </div>

                    <div th:if="${#lists.isEmpty(examples)}" style="color:var(--text-muted);">
                        No example ads yet.
                    </div>

                    <div th:each="example : ${examples}"
                         class="d-flex justify-content-between align-items-center py-2"
                         style="border-bottom:1px solid var(--border);">
                        <span th:text="${example.mediaType} + ' — ' + ${example.mediaUrl} + (${example.caption} != null ? ' (' + ${example.caption} + ')' : '')"></span>
                        <div class="d-flex gap-2">
                            <a th:href="@{/admin/examples/edit/{id}(id=${example.id})}"
                               style="color:var(--text-muted); text-decoration:none; font-size:0.85rem;">✎</a>
                            <form th:action="@{/admin/examples/delete/{id}(id=${example.id})}" method="post"
                                  onsubmit="return confirm('Delete this ad example?')">
                                <input type="hidden" name="packageId" th:value="${pkg.id}"/>
                                <button type="submit"
                                        style="background:none; border:none; color:#ff6666; cursor:pointer; font-size:0.85rem;">×</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
