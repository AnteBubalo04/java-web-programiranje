<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Admin - Login History')}">
    <title>LedVision</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="section-title mb-0">Login <span>History</span></h2>
        <a th:href="@{/admin}" class="btn-outline-accent"
           style="padding:0.4rem 1rem; text-decoration:none; font-size:0.9rem;">
            ← Back to Dashboard
        </a>
    </div>

    <div style="border:1px solid var(--border);">

        <!-- Header -->
        <div class="row py-2 px-4"
             style="border-bottom:1px solid var(--border);
                    color:var(--text-muted);
                    font-size:0.75rem;
                    letter-spacing:1px;
                    text-transform:uppercase;">
            <div class="col-md-3">User</div>
            <div class="col-md-2">IP Address</div>
            <div class="col-md-3">Date & Time</div>
            <div class="col-md-4">User Agent</div>
        </div>

        <div th:if="${#lists.isEmpty(loginHistory)}"
             class="py-4 px-4"
             style="color:var(--text-muted);">
            No login history found.
        </div>

        <div th:each="entry : ${loginHistory}"
             class="row py-3 px-4 align-items-center"
             style="border-bottom:1px solid var(--border);">

            <div class="col-md-3"
                 style="font-family:'Rajdhani',sans-serif; font-weight:700;"
                 th:text="${entry.user.username}">
            </div>

            <div class="col-md-2"
                 style="color:var(--accent); font-size:0.85rem;"
                 th:text="${entry.ipAddress}">
            </div>

            <div class="col-md-3"
                 style="color:var(--text-muted); font-size:0.85rem;"
                 th:text="${#temporals.format(entry.loggedAt, 'dd.MM.yyyy HH:mm:ss')}">
            </div>

            <div class="col-md-4"
                 style="color:var(--text-muted); font-size:0.75rem;
                        overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
                 th:text="${entry.userAgent}">
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
