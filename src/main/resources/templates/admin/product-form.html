<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Admin - Product')}">
   <title>Talaria</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="auth-card">
                <h2 class="auth-title"
                    th:text="${product.id != null} ? 'EDIT PRODUCT' : 'NEW PRODUCT'">
                    Product
                </h2>

                <form th:action="@{/admin/products/save}" method="post">
                    <input type="hidden" name="id" th:value="${product.id}"/>

                    <div class="mb-4">
                        <label class="form-label">Name
                        <input type="text"
                               name="name"
                               class="form-control"
                               th:value="${product.name}"
                               required/>
                        </label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description
                        <textarea name="description"
                                  class="form-control"
                                  rows="3"
                                  th:text="${product.description}">
                        </textarea>
                        </label>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Price (€)
                            <input type="number"
                                   name="price"
                                   class="form-control"
                                   step="0.01"
                                   min="0"
                                   th:value="${product.price}"
                                   required/>
                            </label>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock Quantity
                            <input type="number"
                                   name="stockQuantity"
                                   class="form-control"
                                   min="0"
                                   th:value="${product.stockQuantity}"
                                   required/>
                            </label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Image URL
                        <input type="text"
                               name="imageUrl"
                               class="form-control"
                               placeholder="https://..."
                               th:value="${product.imageUrl}"/>
                        </label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Category
                        <select name="categoryId" class="form-control">
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}"
                                    th:selected="${product.category != null and product.category.id == category.id}">
                            </option>
                        </select>
                        </label>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit"
                                class="btn-accent px-4 py-2"
                                style="border:none; cursor:pointer;">
                            Save
                        </button>
                        <a th:href="@{/admin}"
                           class="btn-outline-accent px-4 py-2"
                           style="text-decoration:none;">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
