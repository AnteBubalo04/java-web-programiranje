<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Admin - Pricing Tier')}">
    <title>Talaria</title>
</head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="auth-card">
                <h2 class="auth-title"
                    th:text="${tier.id != null} ? 'EDIT PRICING TIER' : 'NEW PRICING TIER'">
                    Pricing Tier
                </h2>

                <form th:action="@{/admin/tiers/save}" method="post">
                    <input type="hidden" name="id" th:value="${tier.id}"/>
                    <input type="hidden" name="packageId" th:value="${tier.adSpacePackage.id}"/>

                    <div class="mb-4">
                        <label class="form-label">Duration (e.g. "1 week", "1 month")
                        <input type="text"
                               name="durationLabel"
                               class="form-control"
                               th:value="${tier.durationLabel}"
                               required/>
                        </label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Screen size (e.g. "Small (2m²)", "Large (6m²)")
                        <input type="text"
                               name="sizeLabel"
                               class="form-control"
                               th:value="${tier.sizeLabel}"
                               required/>
                        </label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Price (€)
                        <input type="number"
                               name="price"
                               class="form-control"
                               step="0.01"
                               min="0"
                               th:value="${tier.price}"
                               required/>
                        </label>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit"
                                class="btn-accent px-4 py-2"
                                style="border:none; cursor:pointer;">
                            Save
                        </button>
                        <a th:href="@{/admin/packages/edit/{id}(id=${tier.adSpacePackage.id})}"
                           class="btn-outline-accent px-4 py-2"
                           style="text-decoration:none;">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="spacer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
